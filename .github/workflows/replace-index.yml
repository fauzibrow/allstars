name: Replace index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with uploaded file
        run: |
          mv -f website-grup-allstars.html index.html
          git config user.name "fauzibrow"
          git config user.email "fauzibrow@users.noreply.github.com"
          git add -A
          git commit -m "Ganti index.html dengan versi nama member terkoreksi" || echo "nothing to commit"
          git push
