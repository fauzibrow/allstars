name: Rename file to index.html
on:
  workflow_dispatch:
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename website file to index.html
        run: |
          git mv website-grup-allstars.html index.html
          git config user.name "fauzibrow"
          git config user.email "fauzibrow@users.noreply.github.com"
          git commit -m "Rename website-grup-allstars.html to index.html"
          git push
